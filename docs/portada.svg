 <text x="63" y="245" fill="#75e2be" font-size="33" font-weight="600">Del mapa al movimiento.</text>
 <text x="64" y="292" fill="#b6c7cf" font-size="21">Planificación global y aprendizaje por refuerzo</text>
 <text x="64" y="323" fill="#b6c7cf" font-size="21">para navegar hacia una meta y responder a obstáculos.</text>
