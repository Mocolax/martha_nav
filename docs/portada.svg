<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
<title id="title">MARTHA — Del mapa al movimiento</title>
<desc id="desc">Proyecto de navegación autónoma que combina planificación global y aprendizaje por refuerzo. ROS 2, PPO y Gazebo. Ilustración conceptual de un robot y su ruta hacia una meta.</desc>
