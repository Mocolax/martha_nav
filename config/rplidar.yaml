# RPLIDAR A2M8. serial_port comes from the launch.
# flip_x_axis stays false: the LiDAR's mounting (turned 180 degrees as built) is the URDF's
# base_link -> lidar yaw, which RViz, slam_toolbox and the policy all read from TF. Flipping
# here as well would turn the scan twice.
rplidar_node:
  ros__parameters:
    channel_type: serial
    serial_baudrate: 115200
    frame_id: lidar
    inverted: false
    angle_compensate: true
    flip_x_axis: false
    auto_standby: false
    topic_name: /scan
    scan_mode: Sensitivity
    scan_frequency: 10.0
